<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxury Obsidian Background -->
  <rect width="32" height="32" rx="8" fill="#07080d" />
  <rect width="32" height="32" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Iconic Stylized Glowing "8" -->
  <g filter="url(#glow)">
    <!-- Top Loop of 8 -->
    <circle cx="16" cy="11.5" r="4.5" stroke="url(#glowGrad)" stroke-width="2.6" fill="none" />
    <!-- Bottom Loop of 8 -->
    <circle cx="16" cy="20.5" r="5.5" stroke="url(#glowGrad)" stroke-width="2.6" fill="none" />
    <!-- Center Sparkle Core -->
    <circle cx="16" cy="16" r="1" fill="#38bdf8" />
  </g>
</svg>
