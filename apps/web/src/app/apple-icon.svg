<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="appleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxury Glass Canvas -->
  <rect width="180" height="180" rx="40" fill="#07080d" />
  <rect width="180" height="180" rx="40" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Ambient Internal Glow -->
  <circle cx="90" cy="90" r="50" fill="#8b5cf6" opacity="0.15" filter="url(#blurFilter)" />

  <!-- Iconic Stylized Glowing "8" -->
  <g filter="url(#blurFilter)">
    <!-- Top Loop -->
    <circle cx="90" cy="65" r="25" stroke="url(#appleGlow)" stroke-width="12" fill="none" />
    <!-- Bottom Loop -->
    <circle cx="90" cy="115" r="32" stroke="url(#appleGlow)" stroke-width="12" fill="none" />
    <!-- Core Accent -->
    <circle cx="90" cy="90" r="4" fill="#38bdf8" />
  </g>
</svg>
